<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Light Ivory-Warm Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF3EB" />
    </linearGradient>

    <!-- Vibrant Crave Orange Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B2B" />
      <stop offset="100%" stop-color="#E03E00" />
    </linearGradient>

    <!-- Fresh Emerald Mint Gradient -->
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Crisp Light Squircle Base -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)" stroke="#FFD8C7" stroke-width="12" />

  <!-- Bold 'C' Brand Ring in Bright Crave Orange -->
  <path d="M 355 175
           A 140 140 0 1 0 355 337"
        fill="none" 
        stroke="url(#orangeGrad)" 
        stroke-width="56" 
        stroke-linecap="round" />

  <!-- Fork in Deep Red-Orange for high contrast on light background -->
  <path d="M 230 185 V 230 M 256 170 V 230 M 282 185 V 230" 
        stroke="#D93800" 
        stroke-width="16" 
        stroke-linecap="round" />
  <path d="M 220 220 C 220 255 292 255 292 220" 
        stroke="#D93800" 
        stroke-width="16" 
        stroke-linecap="round" 
        fill="none" />
  <path d="M 256 250 V 325" 
        stroke="#D93800" 
        stroke-width="18" 
        stroke-linecap="round" />

  <!-- Fresh Emerald Mint AI Sparkle -->
  <path d="M 370 135 Q 370 170 405 170 Q 370 170 370 205 Q 370 170 335 170 Q 370 170 370 135 Z" fill="url(#mintGrad)" />
  <circle cx="415" cy="125" r="14" fill="#F59E0B" />
</svg>
